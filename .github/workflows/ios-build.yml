name: iOS Build

# Compiles the app on a real Xcode toolchain (GitHub's macOS runners) and
# then actually boots it in the iOS Simulator, so you get real rendered
# screenshots back -- without owning a Mac or an iPhone. Code signing is
# off throughout; the Simulator needs none.
#
# The app is launched with FE_AUTO_ADVANCE=1, a debug-only hook (see
# ContentView.swift) that auto-advances the feed every ~2.5s so this run
# can capture a short series of screenshots across several cards instead
# of just whatever card happens to load first.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-screenshot:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available schemes (sanity check)
        run: xcodebuild -project FEStudyFeed.xcodeproj -list

      - name: Pick an available iPhone simulator
        id: pick_sim
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and "iPhone" in d.get("name", ""):
                      print(d["udid"])
                      sys.exit(0)
          sys.exit(1)
          ')
          echo "Selected simulator UDID: $DEVICE_ID"
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Boot simulator
        run: |
          xcrun simctl boot "${{ steps.pick_sim.outputs.device_id }}" || true
          xcrun simctl bootstatus "${{ steps.pick_sim.outputs.device_id }}" -b

      - name: Build for the selected simulator
        run: |
          xcodebuild build \
            -project FEStudyFeed.xcodeproj \
            -scheme FEStudyFeed \
            -destination "id=${{ steps.pick_sim.outputs.device_id }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Start console log capture
        run: |
          xcrun simctl spawn "${{ steps.pick_sim.outputs.device_id }}" log stream \
            --predicate 'process == "FEStudyFeed"' --style compact \
            > simulator-console.log 2>&1 &
          echo $! > log_pid.txt

      - name: Install and launch the app (auto-advance enabled)
        run: |
          APP_PATH=$(find build/Build/Products -maxdepth 2 -name "FEStudyFeed.app" | head -1)
          echo "App path: $APP_PATH"
          xcrun simctl install "${{ steps.pick_sim.outputs.device_id }}" "$APP_PATH"
          SIMCTL_CHILD_FE_AUTO_ADVANCE=1 xcrun simctl launch "${{ steps.pick_sim.outputs.device_id }}" com.carsonwoodard.festudyfeed

      - name: Capture a series of screenshots as the feed auto-advances
        run: |
          mkdir -p screenshots
          # First card: give the UI a moment to render.
          sleep 5
          xcrun simctl io "${{ steps.pick_sim.outputs.device_id }}" screenshot screenshots/fe-study-feed-01.png

          # The app advances to the next card roughly every 2.5s
          # (FE_AUTO_ADVANCE=1, see ContentView.swift). Shoot 5 more,
          # spaced out enough to land after each advance + its animation.
          for i in 02 03 04 05 06; do
            sleep 3
            xcrun simctl io "${{ steps.pick_sim.outputs.device_id }}" screenshot "screenshots/fe-study-feed-$i.png"
          done

      - name: Confirm the app is still running (didn't crash)
        run: |
          if xcrun simctl spawn "${{ steps.pick_sim.outputs.device_id }}" launchctl list | grep -q com.carsonwoodard.festudyfeed; then
            echo "App is running."
          else
            echo "::error::App is not running -- it likely crashed. Check simulator-console.log."
            exit 1
          fi

      - name: Stop console log capture
        if: always()
        run: kill "$(cat log_pid.txt)" 2>/dev/null || true

      - name: Upload screenshots + console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fe-study-feed-simulator-run
          path: |
            screenshots/*.png
            simulator-console.log
          if-no-files-found: warn
