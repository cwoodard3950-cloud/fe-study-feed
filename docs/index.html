<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FE Study Feed</title>
<meta name="description" content="A swipeable FE Mechanical exam study feed — 156 quiz, flashcard, formula, and handbook-lookup cards with LaTeX-rendered equations and a progress dashboard.">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0D1520">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FE Study">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#EEF1F4;
    --surface:#FFFFFF;
    --surface-2:#E4E9ED;
    --text:#14202B;
    --text-muted:#5B6B7A;
    --border:rgba(20,32,43,0.12);
    --accent:#C98A00;
    --on-accent:#171208;
    --good:#2F9E64;
    --bad:#D64545;
    --good-wash:rgba(47,158,100,0.14);
    --bad-wash:rgba(214,69,69,0.14);
    --shadow:0 8px 24px rgba(20,32,43,0.10);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0D1520; --surface:#16202C; --surface-2:#1E2C3A;
      --text:#EAF0F5; --text-muted:#8FA0B0; --border:rgba(234,240,245,0.12);
      --accent:#FFC24D; --on-accent:#171208;
      --good:#4ADE94; --bad:#FF6B6B;
      --good-wash:rgba(74,222,148,0.16); --bad-wash:rgba(255,107,107,0.16);
      --shadow:0 8px 28px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0D1520; --surface:#16202C; --surface-2:#1E2C3A;
    --text:#EAF0F5; --text-muted:#8FA0B0; --border:rgba(234,240,245,0.12);
    --accent:#FFC24D; --on-accent:#171208;
    --good:#4ADE94; --bad:#FF6B6B;
    --good-wash:rgba(74,222,148,0.16); --bad-wash:rgba(255,107,107,0.16);
    --shadow:0 8px 28px rgba(0,0,0,0.45);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3{font-family:"Archivo",sans-serif;text-wrap:balance;margin:0;}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;}
  button{font-family:inherit;}

  #loading{
    position:fixed;inset:0;z-index:50;background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  }
  #loading[hidden]{display:none;}
  #loading .spark{font-size:28px;color:var(--accent);}
  #loading p{font-size:13px;color:var(--text-muted);}

  /* ---------- Top bar ---------- */
  #topbar{
    position:fixed;
    top:env(safe-area-inset-top,0px);
    left:0;right:0;
    z-index:20;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    -webkit-backdrop-filter:blur(14px);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
  }
  #topbar-row{display:flex;align-items:center;gap:10px;padding:10px 16px 8px;}
  #wordmark{display:flex;flex-direction:column;line-height:1.05;margin-right:auto;}
  #wordmark .name{font-size:16px;font-weight:800;letter-spacing:-0.01em;}
  #wordmark .tag{font-size:10px;color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase;font-weight:600;}
  .pill-btn{
    display:flex;align-items:center;gap:6px;
    border:1px solid var(--border);background:var(--surface);color:var(--text);
    border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;
  }
  #streak-badge{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;}
  #streak-badge .flame{color:var(--accent);}
  #stats-btn{width:36px;height:36px;padding:0;justify-content:center;border-radius:50%;}
  #chip-row{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none;}
  #chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;
    border:1px solid var(--border);background:var(--surface);color:var(--text-muted);
    cursor:pointer;white-space:nowrap;
  }
  .chip[aria-pressed="true"]{background:var(--chip-color, var(--accent));color:var(--on-accent);border-color:transparent;}
  #position-track{height:2px;background:var(--border);margin:0 16px 10px;border-radius:2px;overflow:hidden;}
  #position-fill{height:100%;background:var(--accent);width:0%;transition:width .25s ease;}

  /* ---------- Feed ---------- */
  #feed{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth;}
  .card-page{
    height:100%;width:100%;scroll-snap-align:start;scroll-snap-stop:always;
    display:flex;flex-direction:column;padding:16px;
    padding-top:calc(var(--topbar-h, 96px) + 14px);
    padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);
    overflow-y:auto;
  }
  .card-inner{
    flex:1;display:flex;flex-direction:column;
    background:var(--surface);border-radius:22px;border:1px solid var(--border);
    box-shadow:var(--shadow);padding:22px 20px;
    border-left:5px solid var(--topic-color, var(--accent));min-height:0;
  }
  .card-tags{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .tag{font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:4px 9px;border-radius:7px;font-family:"IBM Plex Mono",monospace;}
  .tag-topic{background:var(--topic-color, var(--accent));color:#0D1015;}
  .tag-kind{background:var(--surface-2);color:var(--text-muted);}
  .tag-index{margin-left:auto;color:var(--text-muted);font-size:11px;font-variant-numeric:tabular-nums;}

  .prompt{font-size:22px;font-weight:700;margin-top:18px;line-height:1.32;font-family:"Archivo",sans-serif;}
  .body-area{margin-top:18px;display:flex;flex-direction:column;gap:10px;flex:1;}

  .choice-btn{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 14px;
    border-radius:14px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);
    font-size:15px;font-weight:500;cursor:pointer;
  }
  .choice-btn .mark{margin-left:auto;font-weight:800;font-size:15px;flex:0 0 auto;}
  .choice-btn[data-state="correct"]{background:var(--good-wash);border-color:var(--good);color:var(--good);}
  .choice-btn[data-state="wrong"]{background:var(--bad-wash);border-color:var(--bad);color:var(--bad);}
  .choice-btn[data-state="dim"]{opacity:.5;}

  .reveal-btn{
    display:flex;align-items:center;justify-content:center;gap:8px;padding:15px;border-radius:14px;border:none;
    background:var(--topic-color, var(--accent));color:#0D1015;font-size:15px;font-weight:700;cursor:pointer;
  }
  .answer-box{
    padding:16px;border-radius:14px;background:var(--surface-2);font-size:17px;font-weight:600;
    color:var(--topic-color, var(--accent));min-height:44px;display:flex;align-items:center;
  }
  .answer-box.latex-box{font-size:20px;justify-content:center;text-align:center;color:var(--text);}
  .latex-fallback{font-size:12px;color:var(--text-muted);margin-top:6px;text-align:center;}
  .lookup-box{padding:16px;border-radius:14px;background:var(--surface-2);font-size:15px;font-weight:600;color:var(--topic-color, var(--accent));line-height:1.4;}

  .explain{margin-top:auto;padding-top:14px;border-top:1px dashed var(--border);}
  .explain p{margin:0 0 8px;font-size:13.5px;color:var(--text-muted);line-height:1.5;}
  .ref-line{display:flex;align-items:flex-start;gap:6px;font-size:11.5px;color:var(--text-muted);}
  .ref-line .stamp{flex:0 0 auto;font-family:"IBM Plex Mono",monospace;font-weight:700;padding:2px 6px;border-radius:5px;border:1px solid var(--border);}

  .swipe-hint{text-align:center;font-size:11.5px;color:var(--text-muted);padding-top:10px;letter-spacing:.02em;}

  /* ---------- Stats overlay ---------- */
  #stats-view{
    position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 30px);
  }
  #stats-view[hidden]{display:none;}
  #stats-head{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  #stats-head h2{font-size:20px;}
  #close-stats{margin-left:auto;}
  .tile-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px;}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 10px;text-align:center;}
  .tile .num{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;display:block;}
  .tile .lbl{font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-top:3px;display:block;}
  .tile.accent .num{color:var(--accent);}

  #stats-view h3{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;}
  .topic-row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--border);cursor:pointer;}
  .topic-row:last-child{border-bottom:none;}
  .topic-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;background:var(--dot-color);}
  .topic-info{flex:1;min-width:0;}
  .topic-name{font-size:13.5px;font-weight:600;}
  .topic-bar-track{height:6px;border-radius:4px;background:var(--surface-2);margin-top:5px;overflow:hidden;}
  .topic-bar-fill{height:100%;border-radius:4px;background:var(--dot-color);}
  .topic-pct{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;flex:0 0 auto;width:46px;text-align:right;color:var(--text-muted);}
  .topic-seen{font-size:10.5px;color:var(--text-muted);margin-top:2px;}

  /* ---------- Install tip ---------- */
  #install-tip{
    position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:25;
    background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 14px;
    box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;
  }
  #install-tip[hidden]{display:none;}
  #install-tip p{margin:0;font-size:12.5px;color:var(--text-muted);line-height:1.4;}
  #install-tip strong{color:var(--text);}
  #install-dismiss{flex:0 0 auto;background:none;border:none;color:var(--text-muted);font-size:18px;line-height:1;cursor:pointer;padding:4px;}

  @media (prefers-reduced-motion: reduce){
    #feed{scroll-behavior:auto;}
    *{transition:none !important;}
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spark">&#9670;</div>
  <p>Loading FE Study Feed&hellip;</p>
</div>

<div id="topbar">
  <div id="topbar-row">
    <div id="wordmark">
      <span class="name">FE Study Feed</span>
      <span class="tag" id="filter-label">All Topics · 156 cards</span>
    </div>
    <button class="pill-btn" id="streak-badge"><span class="flame">&#9670;</span><span id="streak-num">0</span></button>
    <button class="pill-btn" id="stats-btn" aria-label="Open stats">&#9776;</button>
  </div>
  <div id="chip-row"></div>
  <div id="position-track"><div id="position-fill"></div></div>
</div>

<div id="feed"></div>

<div id="install-tip" hidden>
  <p><strong>Keep this on your Home Screen.</strong> Tap Share, then "Add to Home Screen" — it opens full-screen like an app and works offline.</p>
  <button id="install-dismiss" aria-label="Dismiss">&times;</button>
</div>

<div id="stats-view" hidden>
  <div id="stats-head">
    <h2>Your Progress</h2>
    <button class="pill-btn" id="close-stats">Done</button>
  </div>
  <div class="tile-row">
    <div class="tile accent"><span class="num" id="tile-streak">0</span><span class="lbl">Day streak</span></div>
    <div class="tile"><span class="num" id="tile-seen">0</span><span class="lbl">Cards seen</span></div>
    <div class="tile"><span class="num" id="tile-acc">&mdash;</span><span class="lbl">Quiz accuracy</span></div>
  </div>
  <h3>By topic &mdash; weakest first</h3>
  <div id="topic-list"></div>
</div>

<script>
  window.MathJax = { tex: { inlineMath: [['$','$']] }, options: { skipHtmlTags: ['script','noscript','style','textarea'] } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<script>
(function(){
  "use strict";

  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("service-worker.js").catch(function(){});
    });
  }

  var TOPICS = [
    {id:"mathematics", name:"Mathematics", short:"Math"},
    {id:"probabilityStatistics", name:"Probability & Statistics", short:"Prob & Stats"},
    {id:"ethicsEconomics", name:"Ethics & Engineering Economics", short:"Ethics & Econ"},
    {id:"electricityMagnetism", name:"Electricity & Magnetism", short:"E&M"},
    {id:"statics", name:"Statics", short:"Statics"},
    {id:"dynamics", name:"Dynamics, Kinematics & Vibrations", short:"Dynamics"},
    {id:"mechanicsOfMaterials", name:"Mechanics of Materials", short:"Mech of Materials"},
    {id:"materialProperties", name:"Material Properties & Processing", short:"Materials"},
    {id:"fluidMechanics", name:"Fluid Mechanics", short:"Fluids"},
    {id:"thermodynamics", name:"Thermodynamics", short:"Thermo"},
    {id:"heatTransfer", name:"Heat Transfer", short:"Heat Transfer"},
    {id:"measurementsControls", name:"Measurements, Instrumentation & Controls", short:"Measurements"},
    {id:"mechanicalDesign", name:"Mechanical Design & Analysis", short:"Design"},
    {id:"generalME", name:"General ME Fundamentals", short:"General ME"}
  ];
  var TOPIC_IDX = {};
  TOPICS.forEach(function(t, i){ TOPIC_IDX[t.id] = i; t.hue = Math.round((i / TOPICS.length) * 360); });

  function isDark(){
    var explicit = document.documentElement.getAttribute("data-theme");
    if (explicit === "dark") return true;
    if (explicit === "light") return false;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function topicColor(topicId){
    var t = TOPICS[TOPIC_IDX[topicId]] || {hue:40};
    var l = isDark() ? 62 : 40;
    return "hsl(" + t.hue + ", 60%, " + l + "%)";
  }
  function topicDot(topicId){
    var t = TOPICS[TOPIC_IDX[topicId]] || {hue:40};
    return "hsl(" + t.hue + ", 60%, 52%)";
  }

  var CARDS = [];
  var CARD_BY_ID = {};
  var KIND_LABEL = { quiz:"Quiz", flashcard:"Flashcard", formula:"Formula", handbookLookup:"Handbook Lookup" };

  function buildOrder(filterTopic){
    if (filterTopic){
      return CARDS.filter(function(c){ return c.topic === filterTopic; }).map(function(c){ return c.id; });
    }
    var groups = {};
    var order = [];
    CARDS.forEach(function(c){ (groups[c.topic] = groups[c.topic] || []).push(c.id); });
    var keys = TOPICS.map(function(t){ return t.id; }).filter(function(k){ return groups[k]; });
    var max = 0;
    keys.forEach(function(k){ max = Math.max(max, groups[k].length); });
    for (var i = 0; i < max; i++){
      keys.forEach(function(k){ if (groups[k][i]) order.push(groups[k][i]); });
    }
    return order;
  }

  // ---------------- Progress store (localStorage — this is an installed app on one device) ----------------
  var progress = { cards:{}, streak:{current:0, longest:0, lastDate:""} };
  var LS_KEY = "festudyfeed-progress-v1";

  function loadProgress(){
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) progress = JSON.parse(raw);
    } catch(e){}
  }
  function saveProgress(){
    try { localStorage.setItem(LS_KEY, JSON.stringify(progress)); } catch(e){}
  }

  function todayKey(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function touchStreak(){
    var today = todayKey();
    var s = progress.streak;
    if (s.lastDate === today) return;
    if (s.lastDate){
      var prev = new Date(s.lastDate + "T00:00:00");
      var diffDays = Math.round((new Date(today + "T00:00:00") - prev) / 86400000);
      s.current = (diffDays === 1) ? (s.current + 1) : 1;
    } else {
      s.current = 1;
    }
    s.longest = Math.max(s.longest || 0, s.current);
    s.lastDate = today;
    renderStreakBadge();
  }
  function recordSeen(cardId){
    var rec = progress.cards[cardId] || (progress.cards[cardId] = {s:0, c:0});
    rec.s += 1;
    touchStreak();
    saveProgress();
  }
  function recordAnswer(cardId, correct){
    var rec = progress.cards[cardId] || (progress.cards[cardId] = {s:0, c:0});
    rec.s += 1;
    if (correct) rec.c += 1;
    touchStreak();
    saveProgress();
  }
  function renderStreakBadge(){
    document.getElementById("streak-num").textContent = progress.streak.current || 0;
    document.getElementById("tile-streak").textContent = progress.streak.current || 0;
  }

  // ---------------- Feed rendering ----------------
  var feedEl = document.getElementById("feed");
  var currentFilter = null;
  var currentOrder = [];

  function setTopbarHeight(){
    var tb = document.getElementById("topbar");
    document.documentElement.style.setProperty("--topbar-h", tb.offsetHeight + "px");
  }

  function renderChips(){
    var row = document.getElementById("chip-row");
    row.innerHTML = "";
    var all = document.createElement("button");
    all.className = "chip";
    all.textContent = "All Topics";
    all.setAttribute("aria-pressed", currentFilter === null ? "true" : "false");
    all.addEventListener("click", function(){ setFilter(null); });
    row.appendChild(all);
    TOPICS.forEach(function(t){
      var chip = document.createElement("button");
      chip.className = "chip";
      chip.textContent = t.short;
      chip.style.setProperty("--chip-color", topicColor(t.id));
      chip.setAttribute("aria-pressed", currentFilter === t.id ? "true" : "false");
      chip.addEventListener("click", function(){ setFilter(t.id); });
      row.appendChild(chip);
    });
  }

  function setFilter(topicId){
    currentFilter = topicId;
    renderChips();
    var label = document.getElementById("filter-label");
    if (topicId){
      var t = TOPICS[TOPIC_IDX[topicId]];
      label.textContent = t.name + " · " + CARDS.filter(function(c){return c.topic===topicId;}).length + " cards";
    } else {
      label.textContent = "All Topics · " + CARDS.length + " cards";
    }
    currentOrder = buildOrder(topicId);
    renderFeed();
    feedEl.scrollTop = 0;
  }

  function buildChoiceCard(card, wrap){
    var choices = document.createElement("div");
    choices.className = "body-area";
    var resolved = false;
    card.choices.forEach(function(choiceText, idx){
      var btn = document.createElement("button");
      btn.className = "choice-btn";
      var txt = document.createElement("span");
      txt.textContent = choiceText;
      btn.appendChild(txt);
      var mark = document.createElement("span");
      mark.className = "mark";
      btn.appendChild(mark);
      btn.addEventListener("click", function(){
        if (resolved) return;
        resolved = true;
        var isCorrect = idx === card.correctIndex;
        Array.prototype.forEach.call(choices.children, function(otherBtn, otherIdx){
          if (otherIdx === card.correctIndex){
            otherBtn.setAttribute("data-state", "correct");
            otherBtn.querySelector(".mark").textContent = "✓";
          } else if (otherIdx === idx){
            otherBtn.setAttribute("data-state", "wrong");
            otherBtn.querySelector(".mark").textContent = "✗";
          } else {
            otherBtn.setAttribute("data-state", "dim");
          }
        });
        recordAnswer(card.id, isCorrect);
        showExplain(wrap, card);
      });
      choices.appendChild(btn);
    });
    return choices;
  }

  function typesetLatex(box, card, container){
    function fallback(){
      if (container.querySelector(".latex-fallback")) return;
      var note = document.createElement("div");
      note.className = "latex-fallback";
      note.textContent = "Couldn't render the equation — plain text: " + card.answer;
      container.appendChild(note);
    }
    if (window.MathJax && window.MathJax.typesetPromise){
      window.MathJax.typesetPromise([box]).catch(fallback);
    } else if (window.MathJax && window.MathJax.startup && window.MathJax.startup.promise){
      var timeout = new Promise(function(_, reject){ setTimeout(reject, 5000); });
      Promise.race([window.MathJax.startup.promise, timeout])
        .then(function(){ return window.MathJax.typesetPromise([box]); })
        .catch(fallback);
    } else {
      fallback();
    }
  }

  function buildRevealCard(card, wrap, kind){
    var container = document.createElement("div");
    container.className = "body-area";
    var btn = document.createElement("button");
    btn.className = "reveal-btn";
    btn.textContent = kind === "handbookLookup" ? "Reveal Location" : "Show Answer";
    container.appendChild(btn);
    btn.addEventListener("click", function(){
      container.innerHTML = "";
      if (kind === "handbookLookup"){
        var lb = document.createElement("div");
        lb.className = "lookup-box";
        lb.style.setProperty("--topic-color", topicColor(card.topic));
        lb.textContent = card.handbookRef;
        container.appendChild(lb);
      } else if (kind === "formula" && card.latex){
        var box = document.createElement("div");
        box.className = "answer-box latex-box";
        box.id = "eq-" + card.id;
        box.textContent = "$" + card.latex + "$";
        container.appendChild(box);
        typesetLatex(box, card, container);
      } else {
        var ab = document.createElement("div");
        ab.className = "answer-box";
        ab.style.setProperty("--topic-color", topicColor(card.topic));
        ab.textContent = card.answer;
        container.appendChild(ab);
      }
      recordSeen(card.id);
      showExplain(wrap, card);
    });
    return container;
  }

  function showExplain(wrap, card){
    if (wrap.querySelector(".explain")) return;
    var explain = document.createElement("div");
    explain.className = "explain";
    var p = document.createElement("p");
    p.textContent = card.explanation;
    explain.appendChild(p);
    if (card.kind !== "handbookLookup"){
      var ref = document.createElement("div");
      ref.className = "ref-line";
      var stamp = document.createElement("span");
      stamp.className = "stamp";
      stamp.textContent = card.handbookPage ? ("§ p." + card.handbookPage) : "§ REF";
      ref.appendChild(stamp);
      var refText = document.createElement("span");
      refText.textContent = card.handbookRef;
      ref.appendChild(refText);
      explain.appendChild(ref);
    }
    wrap.appendChild(explain);
  }

  function buildCardEl(card, index, total){
    var page = document.createElement("section");
    page.className = "card-page";
    page.dataset.cardId = card.id;

    var inner = document.createElement("div");
    inner.className = "card-inner";
    inner.style.setProperty("--topic-color", topicColor(card.topic));

    var tags = document.createElement("div");
    tags.className = "card-tags";
    var topicTag = document.createElement("span");
    topicTag.className = "tag tag-topic";
    topicTag.textContent = (TOPICS[TOPIC_IDX[card.topic]] || {short:card.topic}).short;
    tags.appendChild(topicTag);
    var kindTag = document.createElement("span");
    kindTag.className = "tag tag-kind";
    kindTag.textContent = KIND_LABEL[card.kind] || card.kind;
    tags.appendChild(kindTag);
    var idxTag = document.createElement("span");
    idxTag.className = "tag-index mono";
    idxTag.textContent = String(index+1).padStart(3,"0") + " / " + total;
    tags.appendChild(idxTag);
    inner.appendChild(tags);

    var prompt = document.createElement("div");
    prompt.className = "prompt";
    prompt.textContent = card.prompt;
    inner.appendChild(prompt);

    if (card.kind === "quiz"){
      inner.appendChild(buildChoiceCard(card, inner));
    } else if (card.kind === "flashcard" || card.kind === "formula"){
      inner.appendChild(buildRevealCard(card, inner, card.kind));
    } else {
      inner.appendChild(buildRevealCard(card, inner, "handbookLookup"));
    }

    var hint = document.createElement("div");
    hint.className = "swipe-hint";
    hint.textContent = "↑ swipe up for next";
    inner.appendChild(hint);

    page.appendChild(inner);
    return page;
  }

  var io = null;
  function renderFeed(){
    feedEl.innerHTML = "";
    var frag = document.createDocumentFragment();
    currentOrder.forEach(function(id, i){
      var card = CARD_BY_ID[id];
      if (!card) return;
      frag.appendChild(buildCardEl(card, i, currentOrder.length));
    });
    feedEl.appendChild(frag);

    if (io) io.disconnect();
    io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (e.isIntersecting && e.intersectionRatio > 0.6){
          var idx = currentOrder.indexOf(e.target.dataset.cardId);
          if (idx >= 0){
            var pct = currentOrder.length > 1 ? (idx / (currentOrder.length - 1)) * 100 : 100;
            document.getElementById("position-fill").style.width = pct + "%";
          }
        }
      });
    }, { root: feedEl, threshold: [0.6] });
    Array.prototype.forEach.call(feedEl.children, function(el){ io.observe(el); });
  }

  // ---------------- Stats view ----------------
  function computeTopicStats(){
    var byTopic = {};
    TOPICS.forEach(function(t){ byTopic[t.id] = {seen:0, quizSeen:0, quizCorrect:0}; });
    CARDS.forEach(function(c){
      var rec = progress.cards[c.id];
      if (!rec) return;
      var b = byTopic[c.topic];
      if (!b) return;
      b.seen += rec.s;
      if (c.kind === "quiz"){ b.quizSeen += rec.s; b.quizCorrect += rec.c; }
    });
    return byTopic;
  }

  function renderStats(){
    var byTopic = computeTopicStats();
    var totalSeen = 0, totalQuizSeen = 0, totalQuizCorrect = 0;
    Object.keys(byTopic).forEach(function(k){
      totalSeen += byTopic[k].seen;
      totalQuizSeen += byTopic[k].quizSeen;
      totalQuizCorrect += byTopic[k].quizCorrect;
    });
    document.getElementById("tile-seen").textContent = totalSeen;
    document.getElementById("tile-acc").textContent = totalQuizSeen ? Math.round(100*totalQuizCorrect/totalQuizSeen) + "%" : "—";
    renderStreakBadge();

    var list = document.getElementById("topic-list");
    list.innerHTML = "";
    var rows = TOPICS.map(function(t){
      var b = byTopic[t.id];
      var acc = b.quizSeen ? (b.quizCorrect / b.quizSeen) : null;
      return {t:t, b:b, acc:acc};
    });
    rows.sort(function(a,b){
      var aa = a.acc === null ? -1 : a.acc;
      var bb = b.acc === null ? -1 : b.acc;
      if (aa !== bb) return aa - bb;
      return b.b.seen - a.b.seen;
    });
    rows.forEach(function(r){
      var row = document.createElement("div");
      row.className = "topic-row";
      row.addEventListener("click", function(){
        setFilter(r.t.id);
        document.getElementById("stats-view").hidden = true;
      });
      var dot = document.createElement("span");
      dot.className = "topic-dot";
      dot.style.setProperty("--dot-color", topicDot(r.t.id));
      row.appendChild(dot);

      var info = document.createElement("div");
      info.className = "topic-info";
      var name = document.createElement("div");
      name.className = "topic-name";
      name.textContent = r.t.name;
      info.appendChild(name);
      var track = document.createElement("div");
      track.className = "topic-bar-track";
      var fill = document.createElement("div");
      fill.className = "topic-bar-fill";
      fill.style.setProperty("--dot-color", topicDot(r.t.id));
      fill.style.width = (r.acc === null ? 0 : Math.round(r.acc*100)) + "%";
      track.appendChild(fill);
      info.appendChild(track);
      var seenLine = document.createElement("div");
      seenLine.className = "topic-seen";
      seenLine.textContent = r.b.seen + " reviewed" + (r.b.quizSeen ? " · " + r.b.quizSeen + " quiz" : "");
      info.appendChild(seenLine);
      row.appendChild(info);

      var pct = document.createElement("div");
      pct.className = "topic-pct";
      pct.textContent = r.acc === null ? "—" : Math.round(r.acc*100) + "%";
      row.appendChild(pct);

      list.appendChild(row);
    });
  }

  // ---------------- Wiring ----------------
  document.getElementById("stats-btn").addEventListener("click", function(){
    renderStats();
    document.getElementById("stats-view").hidden = false;
  });
  document.getElementById("close-stats").addEventListener("click", function(){
    document.getElementById("stats-view").hidden = true;
  });

  document.getElementById("install-dismiss").addEventListener("click", function(){
    document.getElementById("install-tip").hidden = true;
    try { localStorage.setItem("festudyfeed-install-tip-dismissed", "1"); } catch(e){}
  });

  function isStandalone(){
    return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  }
  try {
    if (!isStandalone() && !localStorage.getItem("festudyfeed-install-tip-dismissed") && /iphone|ipad|ipod/i.test(navigator.userAgent)){
      setTimeout(function(){ document.getElementById("install-tip").hidden = false; }, 1200);
    }
  } catch(e){}

  window.addEventListener("resize", setTopbarHeight);

  function boot(){
    loadProgress();
    renderStreakBadge();
    renderChips();
    setTopbarHeight();
    setFilter(null);
    document.getElementById("loading").hidden = true;
  }

  fetch("cards.json")
    .then(function(r){ return r.json(); })
    .then(function(data){
      CARDS = data;
      CARDS.forEach(function(c){ CARD_BY_ID[c.id] = c; });
      boot();
    })
    .catch(function(){
      document.getElementById("loading").innerHTML = "<p>Couldn't load card data. Check your connection and reopen the app.</p>";
    });
})();
</script>
</body>
</html>
